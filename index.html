<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f8cff">
  <meta name="description" content="Automatischer Putzplan für dein Zuhause – weiß, wann was geputzt werden muss.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Putzplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="tabs" class="tabs" aria-label="Navigation">
      <button data-tab="today" class="tab"><span class="tab-icon">✨</span><span>Heute</span></button>
      <button data-tab="week" class="tab"><span class="tab-icon">📅</span><span>Woche</span></button>
      <button data-tab="rooms" class="tab"><span class="tab-icon">🏠</span><span>Räume</span></button>
      <button data-tab="team" class="tab"><span class="tab-icon">🏆</span><span>Team</span></button>
      <button data-tab="settings" class="tab"><span class="tab-icon">⚙️</span><span>Mehr</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="scheduler.js"></script>
  <script src="templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
